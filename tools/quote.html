<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Solar Quotation Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f5f5f7; --panel:#fff; --panel2:#fbfbfd; --side:rgba(246,246,248,.86);
  --text:#1d1d1f; --text2:#6e6e73; --text3:#86868b; --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.05);
  --accent:#0071e3; --accentSoft:rgba(0,113,227,.1); --field:#fff; --fieldLine:rgba(0,0,0,.12);
  --danger:#ff3b30; --ok:#34c759; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --seg:#e8e8ed; --segOn:#fff; --pvbg:#e9e9ee;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000; --panel:#1c1c1e; --panel2:#232325; --side:rgba(28,28,30,.86);
  --text:#f5f5f7; --text2:#a1a1a6; --text3:#8e8e93; --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.06);
  --accent:#0a84ff; --accentSoft:rgba(10,132,255,.18); --field:#2c2c2e; --fieldLine:rgba(255,255,255,.12);
  --seg:#2c2c2e; --segOn:#636366; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --pvbg:#0b0b0c;
}}
:root[data-theme="dark"]{
  --bg:#000; --panel:#1c1c1e; --panel2:#232325; --side:rgba(28,28,30,.86);
  --text:#f5f5f7; --text2:#a1a1a6; --text3:#8e8e93; --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.06);
  --accent:#0a84ff; --accentSoft:rgba(10,132,255,.18); --field:#2c2c2e; --fieldLine:rgba(255,255,255,.12);
  --seg:#2c2c2e; --segOn:#636366; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --pvbg:#0b0b0c;
}
*{box-sizing:border-box}
:root{--ease:cubic-bezier(.25,.1,.25,1)}
button:focus-visible,summary:focus-visible,.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
/* toolbar */
.tb{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--side);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em;white-space:nowrap}
.brand i{width:28px;height:28px;border-radius:8px;background:#0a3a54;display:grid;place-items:center;color:#fff;font-style:normal}
.brand i svg{width:16px;height:16px}
.doc{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:26vw}
.sp{flex:1}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.btn{transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:28px;padding:0 8px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accentSoft)}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn svg{width:16px;height:16px}
.btn.danger{color:var(--danger)}
/* layout */
.app{display:grid;grid-template-columns:minmax(360px,450px) 1fr;height:calc(100vh - 52px)}
.ed{overflow:auto;padding:16px 16px 92px;border-right:1px solid var(--line)}
.ed h3{font-size:13px;font-weight:500;color:var(--text2);margin:24px 4px 8px;display:flex;align-items:center;gap:8px}
.ed h3:first-child{margin-top:0}
.ed h3 .sp{flex:1}
.card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;min-height:40px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row>span{flex:none;width:120px;color:var(--text)}
.row>span small{display:block;color:var(--text3);font-size:11px}
.row input,.row select,.row textarea{flex:1;min-width:0;border:0;background:transparent;outline:none;text-align:right;padding:4px 0}
.row input::placeholder{color:var(--text3)}
.row textarea{text-align:left;resize:vertical;min-height:70px;width:100%}
.row.col{flex-direction:column;align-items:stretch;gap:4px}
.row.col>span{width:auto;color:var(--text2);font-size:12px}
.row.col textarea,.row.col input{text-align:left;background:var(--field);border:1px solid var(--fieldLine);border-radius:8px;padding:7px 9px}
.row.col textarea:focus,.row.col input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.row select{appearance:none;-webkit-appearance:none;cursor:pointer;text-align:right;text-align-last:right;color:var(--accent)}
.row input:focus{color:var(--accent)}
.row .unit{flex:none;color:var(--text3);font-size:12px}
.hint{color:var(--text3);font-size:12px;margin:8px 8px 0;line-height:1.5}
.sw{position:relative;width:40px;height:24px;flex:none;margin-left:auto}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1;width:100%}
.sw i{position:absolute;inset:0;border-radius:24px;background:var(--seg);transition:background-color .2s var(--ease)}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:after{transform:translateX(16px)}
.seg{display:inline-flex;background:var(--seg);border-radius:8px;padding:2px;gap:2px;flex:none}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:6px;transition:background-color .15s var(--ease),color .15s var(--ease);font-size:12px;font-weight:500;cursor:pointer;color:var(--text2);white-space:nowrap}
.seg button.on{background:var(--segOn);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* hero */
.hero{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:20px 20px 16px;text-align:center}
.hero small{color:var(--text3);font-weight:500}
.hero .big{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:2px 0 6px}
.hero .big input{width:150px;border:0;background:transparent;outline:none;text-align:right;font-size:56px;font-weight:600;letter-spacing:-.03em;padding:0;-moz-appearance:textfield}
.hero .big input::-webkit-outer-spin-button,.hero .big input::-webkit-inner-spin-button{-webkit-appearance:none}
.hero .big b{font-size:22px;color:var(--text2);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--text2);font-weight:500;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:left}
.sum div{background:var(--bg);border-radius:12px;padding:8px 12px}
.sum b{display:block;font-size:15px;letter-spacing:-.02em}
.sum span{color:var(--text3);font-size:11px}
.alts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alts .chip{font-size:12px;padding:4px 8px;border-radius:6px}
.alts input{flex:1;min-width:90px;border:1px dashed var(--fieldLine)!important;border-radius:6px!important;padding:4px 8px!important;font-size:12px;background:transparent!important}
/* details list */
details.it{border-bottom:1px solid var(--line2)}
details.it:last-child{border-bottom:0}
details.it>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer}
details.it>summary::-webkit-details-marker{display:none}
details.it .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
details.it .nm small{display:block;color:var(--text3);font-weight:400;font-size:11px}
details.it .chev{color:var(--text3);transition:transform .2s var(--ease);font-size:11px}
details.it[open] .chev{transform:rotate(90deg)}
details.it.off .nm{color:var(--text3);text-decoration:line-through}
details.it .body{background:var(--panel2);border-top:1px solid var(--line2)}
.tot{display:flex;justify-content:space-between;padding:12px 14px;font-weight:600;font-size:15px}
.tot span:last-child{font-variant-numeric:tabular-nums}
/* preview */
.pv{overflow:auto;background:var(--pvbg);padding:22px 20px 60px}
.pgw{margin:0 auto 22px;box-shadow:0 2px 6px rgba(0,0,0,.18),0 18px 40px rgba(0,0,0,.14);border-radius:2px;overflow:hidden;background:#fff}
.mob{display:none}
/* modal */
.mk{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.mk.on{display:flex}
.md{background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.md header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.md .mb{overflow:auto;padding:16px 20px 20px}
.md table{width:100%;border-collapse:collapse;font-size:12.5px}
.md td,.md th{padding:5px 4px;text-align:left;border-bottom:1px solid var(--line2)}
.md th{color:var(--text3);font-weight:500;font-size:11px}
.md td input{width:100%;border:1px solid var(--fieldLine);background:var(--field);border-radius:6px;padding:4px 6px;text-align:right}
.md h4{margin:16px 0 8px;font-size:13px;font-weight:500;color:var(--text2)}
.ql{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2)}
.ql .f{flex:1;min-width:0}.ql small{display:block;color:var(--text3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:rgba(30,30,32,.92);color:#fff;padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .24s var(--ease),transform .24s var(--ease);z-index:80;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%)}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:none;align-items:center;justify-content:center;color:#fff;font-weight:600}
#busy.on{display:flex}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .doc,.tb .lbl{display:none}
  .pv{display:none}.ed{border:0}
  body.m-pv .pv{display:block}body.m-pv .ed{display:none}
  .mob{display:flex;position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:30;background:var(--side);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:99px;padding:3px;box-shadow:var(--shadow)}
  .mob button{border:0;background:transparent;padding:7px 18px;border-radius:99px;font-weight:600;cursor:pointer;color:var(--text2)}
  .mob button.on{background:var(--accent);color:#fff}
}
/* ---------------- A4 document ---------------- */
.pg{--navy:#0a3a54;--ink:#16202a;--mut:#5b6872;--red:#c8372d;width:794px;height:1123px;position:relative;background:#fff;color:var(--ink);font:12px/1.5 "Montserrat",-apple-system,Helvetica,Arial,sans-serif;overflow:hidden;transform-origin:0 0;padding:44px 52px 70px}
.pg *{box-sizing:border-box}
.pg .hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.pg .hd img{height:44px}
.pg .ct{font-size:11px;line-height:1.6;color:var(--ink);text-align:left}
.pg .ct b{font-weight:600}
.pg .ft{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 52px;font-size:10px;letter-spacing:.02em}
.pg .ft i{font-weight:600}
.pg h1.t{font-size:14px;text-align:center;text-decoration:underline;font-weight:600;margin:4px 0 16px;text-underline-offset:3px}
.pg h2{font-size:14px;color:var(--navy);margin:0 0 8px;font-weight:600}
.pg h4{font-size:12px;margin:12px 0 4px;font-weight:600}
.pg b,.pg strong{font-weight:600}
.pg p{margin:0 0 8px}
.pg ul{margin:0 0 6px;padding-left:16px}.pg li{margin:0 0 2px;font-size:11px}
.pg table.q{width:100%;border-collapse:collapse;font-size:11px}
.pg table.q th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:8px;border:1px solid #fff}
.pg table.q td{padding:4px 8px;border:1px solid #cfd6dc;vertical-align:top}
.pg table.q td.r,.pg table.q th.r{text-align:right}
.pg table.q tr.b td{font-weight:600;background:#f2f6f8}
.pg .warn{color:var(--red);font-weight:600;font-style:italic;text-align:center;font-size:12px;margin:12px 0 8px;line-height:1.4}
.pg .words{font-size:11px;color:var(--mut);margin:7px 2px 0}
.pg.cover{padding:0;color:#fff;background:#0a1a25}
.pg.cover .ph{position:absolute;inset:0;background:center/cover no-repeat}
.pg.cover .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,20,30,.15) 0%,rgba(5,20,30,.35) 40%,rgba(5,20,30,.88) 100%)}
.pg.cover .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:0 60px}
.pg.cover .logo{margin-top:330px;width:470px}
.pg.cover .tag{font-style:italic;font-weight:700;font-size:21px;margin-top:6px;letter-spacing:.005em}
.pg.cover .ttl{margin-top:auto;margin-bottom:170px;text-align:center;font-style:italic;font-weight:700}
.pg.cover .ttl b{display:block;font-size:30px;line-height:1.2}
.pg.cover .ttl span{display:block;font-size:21px;margin-top:2px}
.pg.cover .for{position:absolute;left:0;right:0;bottom:46px;text-align:center;font-size:11.5px;letter-spacing:.04em;opacity:.9;line-height:1.7}
.pg.cover .for b{font-size:15px;letter-spacing:0;font-weight:700}
.svc{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
.svc div{border-left:3px solid var(--navy);padding:2px 0 2px 12px}
.svc b{display:block;font-size:13px;color:var(--navy)}
.svc span{color:var(--mut);font-size:11.5px}
.prep{display:flex;gap:30px;margin:0 0 18px;padding:14px 16px;background:#f2f6f8;border-radius:10px}
.prep small{display:block;color:var(--mut);font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.prep b{font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 12px}
.tiles div{background:#f2f6f8;border-radius:8px;padding:8px 12px}
.tiles b{display:block;font-size:16px;color:var(--navy)}
.tiles span{font-size:10px;color:var(--mut)}
.mbar{display:flex;align-items:flex-end;gap:7px;height:96px;margin-top:6px;padding-top:4px;border-bottom:1px solid #cfd6dc}
.mbar div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.mbar i{display:block;width:100%;background:#f2a900;border-radius:4px 4px 0 0}
.mbar em{font-style:normal;font-size:9px;color:var(--mut);margin-bottom:2px}
.mlab{display:flex;gap:7px;font-size:9px;color:var(--mut);text-align:center;margin-top:3px}.mlab span{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.pg table.bom{width:100%;border-collapse:collapse;font-size:10px}
.pg table.bom th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:6px 6px;border:1px solid #fff}
.pg table.bom td{padding:4px 6px;border:1px solid #cfd6dc;vertical-align:top}
.pg .sm{font-size:10px;color:var(--mut)}

.pg .cbox{border:1px solid #cfd6dc;border-radius:12px;padding:12px 16px 8px}
.pg .cbox h5{margin:0 0 8px;font-size:11px;color:var(--mut);font-weight:600}
.pg .cbox.navy{background:var(--navy);border-color:var(--navy);color:#fff}.pg .cbox.navy h5{color:#9fc4d6}.pg .cbox.navy .fl{border-color:rgba(255,255,255,.22)}.pg .cbox.navy .fl small{color:#9fc4d6}
.pg .fl{border-bottom:1px solid #dfe5ea;margin-bottom:4px;padding-bottom:4px;min-height:32px}
.pg .fl small{display:block;font-size:9px;color:var(--mut)}
.pg .fl span{display:block;font-size:11.5px;font-weight:600;min-height:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.svc2{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.svc2>div{display:flex;gap:10px;align-items:flex-start}
.svc2 i{flex:none;width:32px;height:32px;border-radius:8px;background:var(--navy);display:grid;place-items:center}
.svc2 b{display:block;font-size:12px;color:var(--navy)}.svc2 span{display:block;font-size:10px;color:var(--mut);line-height:1.4}
.pg table.q tr.ad td{background:#fff4dc;color:#8a5a00;font-weight:600;font-size:10px;padding:4px 8px}
.pg table.q tr.sb td{color:#1c7c3a;font-weight:600}
.pg table.q tr.net td{background:#e6f6ea;color:#14672f;font-size:13px}
.pg .xnote{background:#fff4dc;border:1px solid #f2c660;border-left:4px solid #f2a900;border-radius:8px;padding:8px 12px;font-size:11px;line-height:1.5;margin:0 0 6px;color:#5c3d00}
.pg .spc{background:#eef5f9;border-left:4px solid var(--navy);border-radius:8px;padding:8px 12px 4px}.pg .spc h4{margin:0 0 6px;color:var(--navy)}.pg .spc ul{list-style:none;padding:0;margin:0}.pg .spc li{margin:0 0 4px;font-size:11px}.pg .spc em{font-style:normal;font-weight:600;color:var(--navy);background:#d4e8f2;padding:1px 7px;border-radius:5px}.pg .spc span{color:var(--mut);font-size:10px}
.pg .sig{display:flex;gap:60px;margin-top:12px;font-size:10px;color:var(--mut)}
.pg .sig div{flex:1;text-align:center}.pg .sig i{display:block;border-bottom:1px solid #8a97a0;height:26px;margin-bottom:4px}
.pg table.bom td .kd{color:var(--mut);font-size:9px;margin-top:2px}
.pj{display:grid;grid-template-columns:1fr 1fr;gap:20px 24px}
.pj .pc{background:#f6f9fb;border-radius:14px;overflow:hidden;border:1px solid #e1e8ed}
.pj .im{height:222px;background:linear-gradient(135deg,#eef3f6,#dde7ed) center/cover no-repeat;display:grid;place-items:center}
.pj .cap{padding:8px 12px 12px}.pj .cap b{display:block;font-size:14px;color:var(--navy)}.pj .cap span{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--mut);margin-top:2px}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}.tb,.ed,.mob,.toast{display:none!important}
  .app{display:block;height:auto}.pv{display:block!important;overflow:visible;padding:0;background:#fff}
  .pgw{width:210mm!important;height:297mm!important;margin:0;box-shadow:none;page-break-after:always;border-radius:0}
  .pg{transform:none!important}
}
</style>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script>/* Sunpour app: Quote & PO is for the admin and staff the admin has switched on */
(function(){function g(k){try{return JSON.parse(localStorage.getItem('spx.'+k))}catch(e){return null}}
var me=g('me'),tok=g('token')||'',cfg=g('config')||{},p=(cfg.people||[]).filter(function(x){return x.id===me})[0];

function extraNoteAuto(){const c=S.cables;return `Included in the base price: AC cable up to ${c.acBase} mtrs, earthing wire up to ${c.earthBase} mtrs and ${c.earthSets} earthing sets. Anything beyond this — extra cable length, extra earthing, additional modules or structure, civil work, load enhancement or name-change charges — is chargeable extra as per actuals.`}
function readImg(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.82))};im.onerror=()=>toast('Could not read that image');im.src=r.result};r.readAsDataURL(file)}

function setVal(el){
  const p=el.dataset.b; let v;
  if(el.dataset.t==='b') v=el.checked;
  else if(el.dataset.t==='n'){v=el.value.trim();v=v===''?null:num(v);}
  else v=el.value;
  setP(p,v);
}
const edEl=()=>$('#ed');
document.addEventListener('input',e=>{const el=e.target;
  if(el.closest('#ed')){
    if(el.dataset.proj){const [i,k]=el.dataset.proj.split('.');PROJ[+i][k]=el.value;saveProj();renderPages();return}
    if(el.dataset.b&&el.type!=='checkbox'&&el.tagName!=='SELECT'){setVal(el);
      // module qty '' → delete override
      if(el.dataset.b==='size'){document.querySelectorAll('[data-size]').forEach(b=>b.classList.toggle('on',num(b.dataset.size)===num(S.size)))}
      changed(false);}
    if(el.dataset.co){CO[el.dataset.co]=el.value;store.set('sqb_co',CO);renderPages();}
    if(el.dataset.addalt)return;
  }});
document.addEventListener('change',e=>{const el=e.target; if(!el.closest('#ed'))return;
  if(el.dataset.pimg!==undefined&&el.files[0]){readImg(el.files[0],d=>{PROJ[+el.dataset.pimg].img=d;saveProj();renderEd();renderPages()});return}
  if(el.dataset.brand){const b=el.dataset.brand; if(el.value==='__c'){customOpen.add(b);setP(b+'.brand','');} else {customOpen.delete(b);setP(b+'.brand',el.value); const a=getP(b+'.alts')||[]; setP(b+'.alts',a.filter(x=>x!==el.value));}
    changed(true);return;}
  if(el.dataset.b&&(el.type==='checkbox'||el.tagName==='SELECT')){setVal(el);changed(true);}
});
document.addEventListener('click',e=>{const t=e.target.closest('button,summary'); if(!t) return;
  if(t.tagName==='SUMMARY'){const d=t.parentElement;setTimeout(()=>{d.open?openRows.add(d.dataset.row):openRows.delete(d.dataset.row)});return;}
  if(!t.closest('#ed'))return;
  if(t.dataset.size){S.size=num(t.dataset.size);changed(true);}
  else if(t.dataset.inv){S.inverter.kw=t.dataset.inv==='auto'?null:num(t.dataset.inv);changed(true);}
  else if(t.dataset.type){S.type=t.dataset.type;changed(true);}
  else if(t.dataset.wp){S.module.wp=num(t.dataset.wp);changed(true);}
  else if(t.dataset.pdel!==undefined){PROJ[+t.dataset.pdel]={img:'',size:PROJ[+t.dataset.pdel].size,loc:PROJ[+t.dataset.pdel].loc};saveProj();renderEd();renderPages();}
  else if(t.dataset.rnd){S.panelRound=t.dataset.rnd;changed(true);}
  else if(t.dataset.alt){const b=t.dataset.alt,n=t.dataset.n;let a=(getP(b+'.alts')||[]).slice();a=a.includes(n)?a.filter(x=>x!==n):[...a,n];setP(b+'.alts',a);changed(true);}
  else if(t.dataset.delx!==undefined){S.extra.splice(+t.dataset.delx,1);changed(true);}
  else if(t.dataset.delp!==undefined){S.pay.splice(+t.dataset.delp,1);changed(true);}
  else if(t.id==='addX'){S.extra.push({name:'',qty:1,rate:0,tax:18});changed(true);}
  else if(t.id==='addP'){S.pay.push({p:0,t:''});changed(true);}
  else if(t.id==='bRates2')openRates();
});
document.addEventListener('keydown',e=>{const el=e.target; if(el.dataset&&el.dataset.addalt&&e.key==='Enter'){e.preventDefault();const v=el.value.trim();if(!v)return;const b=el.dataset.addalt;const a=(getP(b+'.alts')||[]).slice();if(!a.includes(v))a.push(v);setP(b+'.alts',a);changed(true);}

async function download(blob,name){try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==='declined')return}

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},1500)}

const MATERIAL_URL=location.protocol==='file:'?'Material Required.html':IN_APP?'po.html':'https://claude.ai/artifact/SsCWodGx8EKKwTQR4QwnEx';
function materialCode(){const c=calc(),mx=t=>Math.max(0,...(String(t).match(/\d+/g)||[0]).map(Number));
  const P={v:1,ref:S.meta.ref,date:S.meta.date,client:S.client.name,addr:S.client.addr,kw:num(S.size),panels:c.panels,wp:c.wp,tech:S.module.tech.replace('N-type ','').replace('Bifacial TOPCon','Bifacial TOPCon'),dcr:!!S.module.dcr,modBrand:S.module.brand,invKw:S.inverter.kw?num(S.inverter.kw):null,invCount:c.invCount,invBrand:S.inverter.brand,phase:S.inverter.phase,type:S.type,structType:S.structure.type,structBrand:[S.structure.brand,...(S.structure.alts||[])].join(' / '),acLen:mx(S.cables.acBase)||30,earthLen:mx(S.cables.earthBase)||60,earthSets:num(S.cables.earthSets)||3,dcSize:num(S.cables.dc)||4,acSize:S.cables.ac?num(S.cables.ac):null,meter:S.bom.meter&&S.bom.meter.brand!==undefined?S.bom.meter.brand:'LK Solar',add:{ac:c.add.ac,dc:c.add.dc,ew:c.add.ew,pit:c.add.pit,mod:c.add.mod,str:c.add.str},battery:S.type!=='On Grid'?{brand:S.battery.brand,chem:S.battery.chem,kwh:c.battKwh}:{brand:'',chem:'',kwh:0}};
  return btoa(unescape(encodeURIComponent(JSON.stringify(P)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
$('#bMat').onclick=()=>{const code=materialCode();
  modal('Purchase order for this site',`<p style="margin:0 0 12px;font-size:13px;line-height:1.5;color:var(--text2)">Back-office only — it never appears in the client quotation. The list is built from this quotation's size, modules, inverter, structure and add-ons, and you can edit every line there.</p>
  <div style="display:flex;gap:8px;margin-bottom:12px"><a class="btn pri" id="mOpen" href="${MATERIAL_URL}#d=${code}"${IN_APP?'':' target="_blank" rel="noopener"'} style="text-decoration:none">Open purchase order</a><button class="btn" id="mCopy">Copy code</button></div>
  <p class="hint" style="margin:0 0 8px">If it opens empty, press “Copy code”, then in the purchase order choose Import from quotation and paste.</p>
  <textarea id="mCode" readonly style="width:100%;min-height:72px;border:1px solid var(--fieldLine);background:var(--field);border-radius:8px;padding:8px;font:11px/1.4 ui-monospace,Menlo,monospace">${code}</textarea>`);
  $('#mBody').onclick=async e=>{if(e.target.id==='mCopy'){try{await navigator.clipboard.writeText(code);toast('Code copied')}catch(_){const t=$('#mCode');t.select();toast('Select the code and copy it')}}}};
$('#bWa').onclick=()=>{const c=calc(),ph=String(S.client.phone||'').replace(/\D/g,'');
  const msg=`Namaste${S.client.name?' '+S.client.name:''},\nSunpour Solar quotation — ${sizeStr()} kW ${S.type} solar plant\nModules: ${S.module.brand} ${S.module.wp} Wp × ${c.panels}\nInverter: ${S.inverter.brand} ${c.invLabel}\nTotal (incl. GST): ${inr(c.total)}${c.subsidy?'\nPrice after subsidy: '+inr(c.net):''}\nRef: ${S.meta.ref}\nThe detailed PDF proposal follows.`;
  const url='https://wa.me/'+(ph.length===10?'91'+ph:ph)+'?text='+encodeURIComponent(msg);
  try{window.open(url,'_blank','noopener')}catch(e){toast('WhatsApp link blocked here')}};

applyTheme();renderEd();renderPages();$('#docName').textContent=(S.client.name||'Untitled client')+' · '+S.size+' kW';
if(document.fonts)document.fonts.ready.then(renderPages);
</script>
</body>
</html>
