<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purchase Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f5f5f7; --panel:#fff; --panel2:#fbfbfd; --side:rgba(246,246,248,.86);
  --text:#1d1d1f; --text2:#6e6e73; --text3:#86868b; --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.05);
  --accent:#0071e3; --accentSoft:rgba(0,113,227,.1); --field:#fff; --fieldLine:rgba(0,0,0,.12);
  --danger:#ff3b30; --ok:#34c759; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --seg:#e8e8ed; --pvbg:#e9e9ee; --ease:cubic-bezier(.25,.1,.25,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000; --panel:#1c1c1e; --panel2:#232325; --side:rgba(28,28,30,.86);
  --text:#f5f5f7; --text2:#a1a1a6; --text3:#8e8e93; --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.06);
  --accent:#0a84ff; --accentSoft:rgba(10,132,255,.18); --field:#2c2c2e; --fieldLine:rgba(255,255,255,.12);
  --seg:#2c2c2e; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --pvbg:#0b0b0c;
}}
:root[data-theme="dark"]{
  --bg:#000; --panel:#1c1c1e; --panel2:#232325; --side:rgba(28,28,30,.86);
  --text:#f5f5f7; --text2:#a1a1a6; --text3:#8e8e93; --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.06);
  --accent:#0a84ff; --accentSoft:rgba(10,132,255,.18); --field:#2c2c2e; --fieldLine:rgba(255,255,255,.12);
  --seg:#2c2c2e; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --pvbg:#0b0b0c;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button:focus-visible,summary:focus-visible,.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.tb{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--side);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.brand i{width:28px;height:28px;border-radius:8px;background:#0a3a54;display:grid;place-items:center;color:#fff;font-style:normal}
.brand i svg{width:16px;height:16px}
.doc{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28vw}
.sp{flex:1}
.btn{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap;transition:background-color .15s var(--ease),border-color .15s var(--ease)}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--accent);border-color:transparent;color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:28px;padding:0 8px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accentSoft)}
.btn.icon{width:28px;padding:0;justify-content:center}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px}
.app{display:grid;grid-template-columns:minmax(400px,500px) 1fr;height:calc(100vh - 52px)}
.ed{overflow:auto;padding:16px 16px 92px;border-right:1px solid var(--line)}
.ed h3{font-size:13px;font-weight:500;color:var(--text2);margin:24px 4px 8px;display:flex;align-items:center;gap:8px}
.ed h3:first-child{margin-top:0}
.card{background:var(--panel);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:8px 12px;min-height:40px;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row>span{flex:none;width:112px}
.row>span small{display:block;color:var(--text3);font-size:11px}
.row input,.row select{flex:1;min-width:0;border:0;background:transparent;outline:none;text-align:right;padding:4px 0}
.row input::placeholder{color:var(--text3)}
.row select{appearance:none;-webkit-appearance:none;cursor:pointer;text-align:right;text-align-last:right;color:var(--accent)}
.row input:focus{color:var(--accent)}
.row .unit{flex:none;color:var(--text3);font-size:12px;font-style:normal}
.row.col{flex-direction:column;align-items:stretch;gap:4px}
.row.col>span{width:auto;color:var(--text2);font-size:12px}
.row.col textarea,.row.col input{text-align:left;background:var(--field);border:1px solid var(--fieldLine);border-radius:8px;padding:8px}
.row.col textarea{resize:vertical;min-height:64px;width:100%}
.row.col textarea:focus,.row.col input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft);outline:0}
.hint{color:var(--text3);font-size:12px;margin:8px 8px 0;line-height:1.5}
.sw{position:relative;width:40px;height:24px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1;width:100%}
.sw i{position:absolute;inset:0;border-radius:24px;background:var(--seg);transition:background-color .2s var(--ease)}
.sw i:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i:after{transform:translateX(16px)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--text2);font-weight:500}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--ok);background:rgba(52,199,89,.12);border-radius:6px;padding:2px 8px;font-weight:500}
.tag.n{color:var(--text3);background:var(--seg)}
/* material rows */
.gh{display:flex;align-items:center;padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line2);font-size:12px;font-weight:500;color:var(--text2);gap:8px}
.gh .sp{flex:1}
.mr{display:grid;grid-template-columns:40px 1fr 64px 56px 36px 28px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line2)}
.mr.off .nm,.mr.off .q,.mr.off .u{opacity:.4}
.mr input[type=text]{min-width:0;width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 8px;outline:none}
.mr input[type=text]:hover{background:var(--panel2)}
.mr input[type=text]:focus{border-color:var(--accent);background:var(--field);box-shadow:0 0 0 3px var(--accentSoft)}
.mr .q{text-align:right;font-variant-numeric:tabular-nums}
.mr .ed-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.mx{display:none;padding:8px 12px 12px 52px;border-bottom:1px solid var(--line2);background:var(--panel2);grid-template-columns:1fr 1fr;gap:8px}
.mx.open{display:grid}
@media (max-width:600px){ /* phone: item name gets the whole first line, the rest sits compactly under it */
.mr{grid-template-columns:36px 52px 52px 40px 1fr 32px;grid-template-areas:"sw nm nm nm nm nm" ". q u v . x";gap:2px 4px;padding:8px 8px 6px}
.mr .sw{grid-area:sw}.mr input.nm{grid-area:nm;font-size:13px;font-weight:500;padding:4px 6px}
.mr input.q{grid-area:q;text-align:left}.mr input.u{grid-area:u}.mr .vb{grid-area:v;justify-self:start}.mr [data-x]{grid-area:x;justify-self:end}
.mr input.q,.mr input.u{padding:2px 6px;font-size:12px;color:var(--text2);background:var(--panel2)}
.mx{padding:8px 8px 12px 44px}}
.hero{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:20px 20px 16px;text-align:center;margin-bottom:24px}
.hero small{color:var(--text3);font-weight:500}
.hero .big{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:0 0 8px}
.hero .big input{width:150px;border:0;background:transparent;outline:none;text-align:right;font-size:56px;font-weight:600;letter-spacing:-.03em;padding:0;-moz-appearance:textfield}
.hero .big input::-webkit-outer-spin-button,.hero .big input::-webkit-inner-spin-button{-webkit-appearance:none}
.hero .big b{font-size:22px;color:var(--text2);font-weight:600}
.hero .chips{justify-content:center}
.seg{display:inline-flex;background:var(--seg);border-radius:8px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;color:var(--text2)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:left}
.sum div{background:var(--bg);border-radius:12px;padding:8px 12px}
.sum b{display:block;font-size:15px}
.sum span{color:var(--text3);font-size:11px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{font-weight:500;color:var(--text3);font-size:11px;text-align:center;padding:8px 4px}
.tbl td{padding:4px;border-top:1px solid var(--line2);text-align:center}
.tbl td:first-child{text-align:left;padding-left:12px;white-space:nowrap}
.tbl input{width:100%;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px;text-align:center;font-variant-numeric:tabular-nums;outline:none}
.tbl input:hover{background:var(--panel2)}
.tbl input:focus{border-color:var(--accent);background:var(--field)}
.tbl tr.hit td{background:var(--accentSoft)}
.vb{padding:2px 0;text-align:center;font-size:11px}
.vh{font-size:11px;font-weight:600;color:var(--text3);padding:8px 12px 0}
.mx label{display:block;font-size:11px;color:var(--text3)}
.mx input{display:block;width:100%;margin-top:4px;border:1px solid var(--fieldLine);background:var(--field);border-radius:8px;padding:8px}
.mx .wide{grid-column:1/-1}
.mx .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.pv{overflow:auto;background:var(--pvbg);padding:24px 20px 60px}
.pgw{margin:0 auto 24px;box-shadow:0 2px 6px rgba(0,0,0,.18),0 18px 40px rgba(0,0,0,.14);overflow:hidden;background:#fff}
.mob{display:none}
.mk{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.mk.on{display:flex}
.md{background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.md header{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.md .mb{overflow:auto;padding:16px 20px 20px}
.md textarea{width:100%;min-height:120px;border:1px solid var(--fieldLine);background:var(--field);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,monospace}
.ql{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line2)}
.ql .f{flex:1;min-width:0}.ql small{display:block;color:var(--text3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);background:rgba(30,30,32,.92);color:#fff;padding:8px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .24s var(--ease),transform .24s var(--ease);z-index:80;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%)}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:none;align-items:center;justify-content:center;color:#fff;font-weight:600}
#busy.on{display:flex}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .doc,.tb .lbl{display:none}
  .pv{display:none}.ed{border:0}
  body.m-pv .pv{display:block}body.m-pv .ed{display:none}
  .mob{display:flex;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:30;background:var(--side);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:99px;padding:4px;box-shadow:var(--shadow)}
  .mob button{border:0;background:transparent;padding:8px 20px;border-radius:99px;font-weight:600;cursor:pointer;color:var(--text2)}
  .mob button.on{background:var(--accent);color:#fff}
}
/* ---------- A4 vendor sheet ---------- */
.pg{--navy:#0a3a54;--ink:#16202a;--mut:#5b6872;width:794px;height:1123px;position:relative;background:#fff;color:var(--ink);font:12px/1.5 "Montserrat",-apple-system,Helvetica,Arial,sans-serif;overflow:hidden;transform-origin:0 0;padding:40px 48px 64px}
.pg *{box-sizing:border-box}
.pg .hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.pg .hd img{height:52px}
.pg .ct{font-size:10px;line-height:1.6;text-align:right}
.pg .ft{position:absolute;left:0;right:0;bottom:0;height:32px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 48px;font-size:10px}
.pg h1{font-size:22px;font-weight:600;color:var(--navy);margin:0 0 4px}
.pg .sub{color:var(--mut);font-size:11px;margin:0 0 12px}
.pg .meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.pg .box{border:1px solid #cfd6dc;border-radius:12px;padding:8px 16px}
.pg .box h5{margin:0 0 4px;font-size:11px;color:var(--mut);font-weight:600}
.pg .box b{font-weight:600}
.pg .box p{margin:0;font-size:11px;line-height:1.5}
.pg .strip{display:flex;gap:8px;margin-bottom:16px}
.pg .strip div{flex:1;background:#f2f6f8;border-radius:8px;padding:8px 12px}
.pg .strip b{display:block;font-size:14px;color:var(--navy);font-weight:600}
.pg .strip span{font-size:9px;color:var(--mut)}
.pg table{width:100%;border-collapse:collapse;font-size:11px}
.pg th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:8px;border:1px solid #fff}
.pg td{padding:4px 8px;border:1px solid #cfd6dc;vertical-align:top}
.pg td.r,.pg th.r{text-align:right}
.pg tr.g td{background:#eef5f9;color:var(--navy);font-weight:600;font-size:10px;padding:4px 8px}
.pg td .s{display:block;color:var(--mut);font-size:9px;margin-top:2px}
.pg td b{font-weight:600}
.pg .note{background:#fff4dc;border:1px solid #f2c660;border-left:4px solid #f2a900;border-radius:8px;padding:8px 12px;font-size:11px;margin-top:12px;color:#5c3d00;white-space:pre-wrap}
.pg .sig{display:flex;gap:48px;margin-top:20px;font-size:10px;color:var(--mut)}
.pg .sig div{flex:1;text-align:center}.pg .sig i{display:block;border-bottom:1px solid #8a97a0;height:28px;margin-bottom:4px}
/* ---------- delivery checklist ---------- */
.cl{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column}
.cl.on{display:flex}
.clb{display:flex;align-items:center;gap:8px;padding:8px 16px;min-height:52px;background:var(--side);border-bottom:1px solid var(--line);flex-wrap:wrap}
.clb b{font-size:15px;font-weight:600;margin-right:auto}
.cls{overflow:auto;flex:1;padding:16px 16px 48px}
.clw{max-width:860px;margin:0 auto}
.cls h4{font-size:13px;font-weight:500;color:var(--text2);margin:24px 4px 8px}
.ck{display:grid;grid-template-columns:32px minmax(0,1fr) 96px 88px minmax(120px,220px);gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line2)}
.ck:last-child{border-bottom:0}
.ck input[type=checkbox]{width:24px;height:24px;accent-color:var(--ok);cursor:pointer;margin:0}
.ck .n b{display:block;font-weight:500}.ck .n small{display:block;color:var(--text3);font-size:11px}
.ck .o{text-align:right;font-variant-numeric:tabular-nums}.ck .o small{display:block;color:var(--text3);font-size:11px}
.ck input[type=text]{width:100%;min-width:0;border:1px solid var(--fieldLine);background:var(--field);border-radius:8px;padding:8px}
.ck.done .n b{color:var(--ok)}
.ck .st{display:block;font-size:11px;font-weight:500;color:var(--danger)}
@media (max-width:640px){.ck{grid-template-columns:32px minmax(0,1fr) auto;row-gap:8px}.ck .rv{grid-column:2}.ck .rm{grid-column:2/-1}}
.tb{overflow-x:auto}
#clPrint{display:none}
.pg td.bx{text-align:center;font-size:14px;line-height:1.2}
.pg .sq{display:inline-block;width:14px;height:14px;border:1.5px solid #5b6872;border-radius:3px;vertical-align:middle;font-size:11px;line-height:11px;font-weight:600}
@media print{
  body.print-cl .app,body.print-cl .cl,body.print-cl .mk{display:none!important}
  body.print-cl #clPrint{display:block}
  body.print-cl #clPrint .pg{page-break-after:always;transform:none}
  @page{size:A4;margin:0}
  body{background:#fff}.tb,.ed,.mob,.toast{display:none!important}
  .app{display:block;height:auto}.pv{display:block!important;overflow:visible;padding:0;background:#fff}
  .pgw{width:210mm!important;height:297mm!important;margin:0;box-shadow:none;page-break-after:always}
  .pg{transform:none!important}
}
</style>

<script>/* Sunpour app: Quote & PO is for the admin and staff the admin has switched on */
(function(){function g(k){try{return JSON.parse(localStorage.getItem('spx.'+k))}catch(e){return null}}
var me=g('me'),tok=g('token')||'',cfg=g('config')||{},p=(cfg.people||[]).filter(function(x){return x.id===me})[0];
var ok=(me==='admin'&&String(tok).indexOf('admin.')===0)||(p&&p.tools&&p.active!==false);
if(!ok)location.replace('../#home');})();</script>
<style>.tb .app-back{width:32px;padding:0;justify-content:center;flex:none;text-decoration:none;color:inherit}.tb .app-back svg{width:18px;height:18px}
.tb{padding-top:env(safe-area-inset-top,0px);height:auto;min-height:52px}
@media (max-width:700px){ /* phone: one swipeable row, most-used actions first */
.tb{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-left:12px;padding-right:12px;gap:6px}
.tb::-webkit-scrollbar{display:none}
.tb>*{flex:none}.tb .sp{display:none}
.tb .brand{font-size:0;gap:0}
.tb .app-back{order:-3}.tb .brand{order:-2}
#bPdf{order:1}#bWa{order:2}#bMat{order:3}#bCheck{order:3}#bSave{order:4}#bOpen{order:5}#bNew{order:6}#bRates{order:7}#bPrint{order:8}#bTheme{order:9}
.tb .btn{height:34px}}</style>
</head>
<body>
<div class="tb">
<a class="btn app-back" href="../#tools" aria-label="Back to Sunpour app" title="Back to Sunpour app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6l-6 6 6 6"/></svg></a>

  <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></i>Purchase order</div>
  <div class="doc" id="docName"></div>
  <div class="sp"></div>
  <button class="btn" id="bCheck">Checklist</button>
  <button class="btn" id="bNew">New</button>
  <button class="btn" id="bOpen">Open</button>
  <button class="btn" id="bSave">Save</button>
  <button class="btn" id="bTheme" title="Light / dark">Theme</button>
  <button class="btn" id="bPrint">Print</button>
  <button class="btn pri" id="bPdf">Download PO</button>
</div>
<div class="app">
  <div class="ed" id="ed"></div>
  <div class="pv" id="pv"><div id="pages"></div></div>

let PAGE_ADJ=0;
function paginate(groups){
  const pages=[[]], cap=[23-PAGE_ADJ,31-PAGE_ADJ]; let w=0,pi=0;
  const wt=r=>1+(r.spec?0.15:0)+((r.name||'').length>40?0.3:0);
  groups.forEach(g=>{
    const need=0.7+wt(g.rows[0]); if(w+need>cap[pi?1:0]){pages.push([]);pi++;w=0}
    pages[pi].push({h:g.t});w+=0.7;
    g.rows.forEach(r=>{const x=wt(r);if(w+x>cap[pi?1:0]){pages.push([]);pi++;w=0;pages[pi].push({h:g.t+' (continued)'});w+=0.7}pages[pi].push({r});w+=x});
  });
  return pages;
}

  const hdr=()=>`<div class="hd"><img src="${IMG.logo}" alt="Sunpour Solar"><div class="ct"><b>${esc(CO.phone)}</b><br>${esc(CO.email)}<br>GST No. - ${esc(CO.gst)}</div></div>`;
  return pages.map((items,pi)=>{
    const body=items.map(it=>it.h?`<tr class="g"><td colspan="5">${esc(it.h)}</td></tr>`:(()=>{const r=it.r;n++;return `<tr><td>${n}</td><td><b>${esc(r.name)}</b>${r.spec?`<span class="s">${esc(r.spec)}</span>`:''}</td><td>${esc(r.brand)}</td><td class="r">${esc(r.qty)}</td><td>${esc(r.unit)}</td></tr>`})()).join('');
    const first=pi===0, last=pi===total-1;
    return `<div class="pgw" data-v="${v}"><div class="pg">${hdr()}${first?`<h1>Purchase order</h1><p class="sub">PO No. ${esc(poNo(v))} · ${esc(dateStr())}</p>
    <div class="meta"><div class="box"><h5>Order to</h5><p><b>${esc(V.name||'Vendor '+(v+1))}</b>${V.phone?'<br>'+esc(V.phone):''}${V.addr?'<br>'+esc(V.addr):''}</p></div><div class="box"><h5>Project site</h5><p><b>${esc(M.site.client||'Site')}</b>${M.site.addr?'<br>'+esc(M.site.addr):''}${M.po.deliver?'<br><span style="color:var(--mut)">Deliver to: '+esc(M.po.deliver)+'</span>':''}</p></div></div>
    <p class="sub" style="margin-bottom:12px">${esc(plantLine())}</p>`:''}
    <table><tr><th style="width:28px">#</th><th>Item name</th><th style="width:112px">Make</th><th class="r" style="width:56px">Qty</th><th style="width:60px">Unit</th></tr>${body}</table>
    ${last?`${M.notes?`<div class="note">${esc(M.notes)}</div>`:''}<div class="sig"><div><i></i>Vendor acceptance</div><div><i></i>Authorised signatory · ${esc(CO.by)}, ${esc(CO.name)}</div></div>`:''}
    <div class="ft"><span><b>${esc(CO.name)}</b> · Purchase order ${esc(poNo(v))}</span><span>${pi+1}/${total}</span></div></div></div>`}).join('');
}
function overflow(host){return [...host.querySelectorAll('.pg')].some(p=>{const f=p.querySelector('.ft');return [...p.children].filter(c=>c!==f).some(c=>c.offsetTop+c.offsetHeight>1076)})}
function renderPages(){
  let host=document.getElementById('mh');if(!host){host=document.createElement('div');host.id='mh';host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;visibility:hidden;pointer-events:none';document.body.appendChild(host)}
  let html='';for(PAGE_ADJ=0;PAGE_ADJ<=14;PAGE_ADJ++){html=poPages(0)+poPages(1);host.innerHTML=html;if(!overflow(host))break}
  host.innerHTML='';$('#pages').innerHTML=html;fitPages()}
function fitPages(){const pv=$('#pv'),w=Math.max(280,pv.clientWidth-40),s=Math.min(1,w/794);document.querySelectorAll('.pgw').forEach(g=>{g.style.width=794*s+'px';g.style.height=1123*s+'px';g.firstElementChild.style.transform=`scale(${s})`})}

/* ================= modal, toast, ask ================= */
function modal(t,h){$('#mT').textContent=t;$('#mBody').innerHTML=h;$('#mk').classList.add('on')}
function closeModal(){$('#mk').classList.remove('on')}
$('#mX').onclick=closeModal;$('#mk').onclick=e=>{if(e.target.id==='mk')closeModal()};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400)}
function ask(title,msg,ok,onOk,onNo){modal(title,`<p style="margin:0 0 16px;font-size:14px;line-height:1.5">${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="aNo">Cancel</button><button class="btn pri" id="aYes">${esc(ok)}</button></div>`);$('#mBody').onclick=e=>{if(e.target.id==='aYes'){closeModal();onOk()}else if(e.target.id==='aNo'){closeModal();onNo&&onNo()}}}
async function download(blob,name){try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:name,data:blob});return}}catch(e){if(e&&e.code==='declined')return}
  if(!window.claude&&navigator.canShare&&matchMedia('(pointer:coarse)').matches){try{const f=new File([blob],name,{type:blob.type||'application/octet-stream'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},1500)}

/* ================= import from quotation ================= */
function decodeCode(raw){raw=String(raw||'').trim();const i=raw.indexOf('d=');if(i>=0&&raw.includes('#'))raw=raw.slice(raw.indexOf('d=')+2);raw=raw.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/');while(raw.length%4)raw+='=';return JSON.parse(decodeURIComponent(escape(atob(raw))))}
function applyPayload(p){
  if(!p||p.v!==1)throw new Error('bad');
  const I=M.inp,a=p.add||{};
  Object.assign(M.site,{client:p.client||'',addr:p.addr||'',ref:p.ref||'',date:p.date||today()});
  Object.assign(I,{kw:p.kw,panels:p.panels,wp:p.wp,tech:p.tech||I.tech,dcr:!!p.dcr,modBrand:p.modBrand||I.modBrand,invKw:p.invKw||null,invCount:p.invCount||1,invBrand:p.invBrand||I.invBrand,phase:p.phase||'3',type:p.type||'On Grid',structType:p.structType||'std',structBrand:p.structBrand||I.structBrand,acLen:p.acLen||30,earthLen:p.earthLen||60,earthSets:p.earthSets||3,dcSize:p.dcSize||4,acSize:p.acSize||null,meter:p.meter||I.meter,add:{ac:a.ac||0,dc:a.dc||0,ew:a.ew||0,pit:a.pit||0,mod:a.mod||0,str:a.str||0},battery:p.battery||I.battery});
  M.linked=p.ref||'quotation';M.ov={};M.id=uid();M.check={by:'',date:'',items:{}};
}
function openImport(){modal('Import from quotation',`<p class="hint" style="margin:0 0 8px">In the quotation builder press “Purchase order”, copy the code, and paste it here.</p><textarea id="codeIn" placeholder="Paste code"></textarea><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" id="cPaste">Paste from clipboard</button><button class="btn pri" id="cGo">Import</button></div>`);
  $('#mBody').onclick=async e=>{
    if(e.target.id==='cPaste'){try{$('#codeIn').value=await navigator.clipboard.readText()}catch(_){toast('Clipboard is blocked — paste with Cmd/Ctrl + V')}}
    if(e.target.id==='cGo'){try{applyPayload(decodeCode($('#codeIn').value));closeModal();changed(true);toast('Imported from quotation')}catch(_){toast('That code did not work')}}};}
(function fromHash(){try{const h=location.hash||'';if(h.includes('d=')){applyPayload(decodeCode(h));store.set('sml_cur',M);history.replaceState(null,'',location.pathname+location.search)}}catch(_){}})();

/* ================= save / open / new / export ================= */
const saved=()=>store.get('sml_saved',{});
let DB=null;const dbReady=(async()=>{try{DB=window.claude?await claude.use('db'):null}catch(_){DB=null}})();
const recName=()=>`${M.site.client||'Untitled'} · ${M.inp.kw} kW${M.site.ref?' · '+M.site.ref:''}`;
let writing=Promise.resolve();
function saveSite(quiet){
  const rec={name:recName(),updated:Date.now(),state:clone(M)}, id=M.id, all=saved();
  all[id]=rec;const local=store.set('sml_saved',all);
  writing=writing.then(async()=>{await dbReady;
    if(DB){try{await DB.collection('sites').doc(id).set(rec);if(!quiet)toast('Saved');return}catch(e){console.warn(e);if(!quiet)toast('Saved on this device only');return}}
    if(!quiet)toast(local?'Saved on this device':'Storage full')});
  return writing;
}
async function allSaved(){
  const all=saved();await dbReady;
  if(DB){try{(await DB.collection('sites').limit(200).get()).docs.forEach(d=>{const r=d.data();if(r&&r.state&&(!all[d.id]||num(r.updated)>=num(all[d.id].updated)))all[d.id]=r})}catch(e){console.warn(e);toast('Could not reach saved lists online')}}
  return all;
}
let autoT=null;
function autoSave(){clearTimeout(autoT);autoT=setTimeout(()=>{if(saved()[M.id])saveSite(true)},1200)}   // only once a site has been saved
$('#bSave').onclick=()=>saveSite();
$('#bOpen').onclick=async()=>{
  modal('Saved lists','<p class="hint">Loading…</p>');
  const all=await allSaved(),ids=Object.keys(all).sort((a,b)=>num(all[b].updated)-num(all[a].updated));
  $('#mBody').innerHTML=ids.length?ids.map(id=>`<div class="ql"><div class="f"><b>${esc(all[id].name)}</b><small>${esc(new Date(num(all[id].updated)).toLocaleString('en-IN'))}</small></div><button class="btn sm" data-o="${esc(id)}">Open</button><button class="btn sm" data-c="${esc(id)}">Checklist</button><button class="btn sm icon danger" data-d="${esc(id)}">×</button></div>`).join(''):'<p class="hint">Nothing saved yet.</p>';
  $('#mBody').onclick=e=>{const t=e.target.closest('button');if(!t)return;const id=t.dataset.o||t.dataset.c;
    if(id){M=norm(clone(all[id].state));const a=saved();a[M.id]=all[id];store.set('sml_saved',a);closeModal();changed(true);if(t.dataset.c)openCheck()}
    if(t.dataset.d)ask('Delete list','Delete this saved list and its checklist?','Delete',async()=>{const a=saved();delete a[t.dataset.d];store.set('sml_saved',a);if(DB){try{await DB.collection('sites').doc(t.dataset.d).delete()}catch(_){toast('Could not delete the online copy')}}$('#bOpen').click()},()=>$('#bOpen').click())}};
$('#bNew').onclick=()=>ask('New list','Start a new material list? Unsaved changes to this one will be lost — press Save first to keep it.','Start new',()=>{M=newM();openX.clear();changed(true);toast('New list started')});
$('#bTheme').onclick=()=>{const t=store.get('sml_theme','auto'),n=t==='auto'?'dark':t==='dark'?'light':'auto';store.set('sml_theme',n);applyTheme();toast('Appearance: '+n)};
function applyTheme(){const t=store.get('sml_theme','auto');if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
$('#mobTabs').onclick=e=>{const m=e.target.dataset.m;if(!m)return;document.body.classList.toggle('m-pv',m==='pv');document.querySelectorAll('#mobTabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));setTimeout(fitPages,30)};
function textList(v){let n=0;const L=[`Purchase order ${poNo(v)} — ${vName(v)}`,`Site: ${M.site.client||'Site'}${M.site.addr?' ('+M.site.addr+')':''}`,plantLine(),''];rowsOn(v).forEach(g=>{L.push(g.t);g.rows.forEach(r=>{n++;L.push(`${n}. ${r.name}${r.spec?' ('+r.spec+')':''} — ${r.qty} ${r.unit}${r.brand?' · '+r.brand:''}`)});L.push('')});return L.join('\n').trim()}
function fileBase(v){return ('PO_'+(M.site.ref||M.inp.kw+'kW')+'_'+vName(v)+'_'+(M.site.client||'Site')).replace(/[\/\\:*?"<>|]+/g,'-').replace(/\s+/g,'_')}
async function makePdf(pages,name,forPrint){
  if(!pages.length)return toast('Nothing to export');
  if(!window.html2canvas||!window.jspdf){toast('PDF engine needs internet — check the connection');return}
  $('#busy').classList.add('on');
  const host=document.createElement('div');host.style.cssText='position:fixed;left:-10000px;top:0;width:794px;z-index:-1';document.body.appendChild(host);
  try{await (document.fonts?document.fonts.ready:Promise.resolve());
    const pdf=new jspdf.jsPDF({unit:'mm',format:'a4',compress:true});
    for(let i=0;i<pages.length;i++){$('#busyT').textContent=`Building PDF… page ${i+1} of ${pages.length}`;
      const c=pages[i].cloneNode(true);c.style.transform='none';host.innerHTML='';host.appendChild(c);
      await Promise.all([...c.querySelectorAll('img')].map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
      const cv=await html2canvas(c,{scale:2.4,backgroundColor:'#ffffff',useCORS:true,logging:false,width:794,height:1123,windowWidth:794});
      if(i)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297,undefined,'FAST')}
    if(forPrint&&pdf.autoPrint)pdf.autoPrint();
    const blob=pdf.output('blob');$('#busy').classList.remove('on');await download(blob,name+'.pdf');toast(forPrint?'Open the downloaded PDF to print it':'PDF ready — '+(blob.size/1048576).toFixed(1)+' MB');
  }catch(err){console.error(err);toast('PDF failed')}
  finally{host.remove();$('#busy').classList.remove('on');$('#busyT').textContent='Building PDF…'}}
const buildPdf=v=>makePdf([...document.querySelectorAll(`#pages .pgw[data-v="${v}"] .pg`)],fileBase(v));
async function copyText(v){const t=textList(v);try{await navigator.clipboard.writeText(t);toast('Copied — paste into WhatsApp')}catch(_){modal('Copy list',`<textarea id="cp" style="min-height:260px">${esc(t)}</textarea>`);setTimeout(()=>{const x=$('#cp');x&&x.select()},50)}}
$('#bPdf').onclick=()=>{
  const act=[0,1].filter(v=>rowsOn(v).length);
  if(!act.length)return toast('No items to order');
  modal('Download purchase orders',act.map(v=>`<div class="ql"><div class="f"><b>${esc(vName(v))}</b><small>${poNo(v)} · ${rowsOn(v).reduce((a,g)=>a+g.rows.length,0)} items</small></div><button class="btn sm" data-copy="${v}">Copy text</button><button class="btn sm pri" data-pdf="${v}">Download PDF</button></div>`).join(''));
  $('#mBody').onclick=e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.pdf!==undefined){closeModal();buildPdf(+t.dataset.pdf)}if(t.dataset.copy!==undefined)copyText(+t.dataset.copy)}};
// The published web page runs in a sandbox where the browser's print dialog is blocked, so Print produces a PDF there.
const sandboxed=()=>{try{return !!window.claude||window.self!==window.top}catch(_){return true}};
function doPrint(){
  const name='Purchase_Order_'+(M.site.ref||M.inp.kw+'kW').replace(/[\/\\:*?"<>|]+/g,'-');
  if(sandboxed())return makePdf([...document.querySelectorAll('#pages .pg')],name,true);
  const t=document.title;document.title=name;document.body.classList.remove('print-cl');window.print();setTimeout(()=>document.title=t,1500)}

/* ================= delivery checklist ================= */
let clFilter='all';
const ckRows=()=>{const all=buildRows().filter(r=>r.on);return [0,1].map(v=>({v,rows:GROUPS.flatMap(([g])=>all.filter(r=>r.vendor===v&&r.group===g))})).filter(x=>x.rows.length&&(clFilter==='all'||clFilter===String(x.v)))};
const ordKey=r=>`${r.qty} ${r.unit}`;
const ck=k=>M.check.items[k]||{};
function ckStatus(r){const c=ck(r.key);if(c.ord&&c.ord!==ordKey(r))return 'Order changed since checked — was '+c.ord;const got=c.recv;if(got!==undefined&&got!==''&&num(got)<num(r.qty))return `Short by ${fmt(num(r.qty)-num(got))} ${r.unit}`;return ''}
const ckDone=r=>{const c=ck(r.key);return !!c.ok&&c.ord===ordKey(r)};
function ckProgress(){const rs=ckRows().flatMap(x=>x.rows);const done=rs.filter(ckDone).length,short=rs.filter(r=>ckStatus(r).startsWith('Short')).length;return `${done} of ${rs.length} received${short?` · ${short} short`:''}`}
function renderCheck(){
  $('#clSeg').innerHTML=[['all','All'],['0','Vendor 1'],['1','Vendor 2']].map(([k,t])=>`<button data-f="${k}" class="${clFilter===k?'on':''}">${t}</button>`).join('');
  const box=$('.cls'),st=box.scrollTop;
  $('#clBody').innerHTML=`<div class="card"><div class="row"><span>Site</span><input value="${esc([M.site.client,M.site.addr].filter(Boolean).join(', ')||'Untitled site')}" readonly></div><div class="row"><span>Received by</span><input data-cm="by" value="${esc(M.check.by)}" placeholder="Name at site"></div><div class="row"><span>Received on</span><input data-cm="date" value="${esc(M.check.date)}" placeholder="${today()}"></div><div class="row"><span>Progress</span><input id="clProg" value="${esc(ckProgress())}" readonly></div></div>
  ${ckRows().map(x=>`<h4>${esc(vName(x.v))} · ${esc(poNo(x.v))}</h4><div class="card">${x.rows.map(r=>{const c=ck(r.key);return `<div class="ck ${ckDone(r)?'done':''}" data-ck="${r.key}"><input type="checkbox" data-cf="ok" ${ckDone(r)?'checked':''} aria-label="Received ${esc(r.name)}"><div class="n"><b>${esc(r.name)}</b><small>${esc([r.brand,r.spec].filter(Boolean).join(' · '))}</small><span class="st">${esc(ckStatus(r))}</span></div><div class="o">${esc(r.qty)} ${esc(r.unit)}<small>ordered</small></div><div class="rv"><input type="text" inputmode="decimal" data-cf="recv" value="${esc(c.recv??'')}" placeholder="Received"></div><div class="rm"><input type="text" data-cf="note" value="${esc(c.note??'')}" placeholder="Remarks"></div></div>`}).join('')}</div>`).join('')||'<p class="hint">No items for this vendor.</p>'}
  <p class="hint">Ticks are kept in this browser as you go. Press Save once to store the site online — after that, changes save by themselves and you can open it from Open on another device signed in to your account.</p>`;
  box.scrollTop=st;
}
function openCheck(){renderCheck();$('#cl').classList.add('on')}
function ckSet(el){
  const row=el.closest('[data-ck]'),key=row.dataset.ck,f=el.dataset.cf,r=buildRows().find(x=>x.key===key);if(!r)return;
  const c=M.check.items[key]||(M.check.items[key]={});
  if(f==='ok'){c.ok=el.checked;c.recv=el.checked?String(r.qty):'';row.querySelector('[data-cf="recv"]').value=c.recv}
  else if(f==='recv'){c.recv=el.value.trim();c.ok=c.recv!==''&&num(c.recv)>=num(r.qty);row.querySelector('[data-cf="ok"]').checked=c.ok}
  else c.note=el.value;
  if(f!=='note')c.ord=ordKey(r);
  row.classList.toggle('done',ckDone(r));row.querySelector('.st').textContent=ckStatus(r);$('#clProg').value=ckProgress();
  store.set('sml_cur',M);autoSave();
}
$('#cl').addEventListener('input',e=>{const el=e.target;if(el.dataset.cm){M.check[el.dataset.cm]=el.value;store.set('sml_cur',M);autoSave()}else if(el.dataset.cf&&el.type!=='checkbox')ckSet(el)});
$('#cl').addEventListener('change',e=>{if(e.target.type==='checkbox')ckSet(e.target)});
$('#cl').addEventListener('click',e=>{const f=e.target.dataset&&e.target.dataset.f;if(f){clFilter=f;renderCheck()}});
function checkPagesHtml(cap){
  const items=[];let n=0;ckRows().forEach(x=>{items.push({h:`${vName(x.v)} · ${poNo(x.v)}`});x.rows.forEach(r=>items.push({r,n:++n}))});
  if(!n)return '';
  const pages=[];let i=0;while(i<items.length){const size=pages.length?cap+5:cap;let part=items.slice(i,i+size);if(part.length>1&&part[part.length-1].h)part=part.slice(0,-1);pages.push(part);i+=part.length}
  return pages.map((part,pi)=>`<div class="pg"><div class="hd"><img src="${IMG.logo}" alt="Sunpour Solar"><div class="ct"><b>${esc(CO.phone)}</b><br>${esc(CO.email)}</div></div>
  ${pi===0?`<h1>Material delivery checklist</h1><p class="sub">${esc(plantLine())}</p><div class="meta"><div class="box"><h5>Project site</h5><p><b>${esc(M.site.client||'Site')}</b>${M.site.addr?'<br>'+esc(M.site.addr):''}</p></div><div class="box"><h5>Received</h5><p>By: <b>${esc(M.check.by)||'____________________'}</b><br>On: <b>${esc(M.check.date)||'____________________'}</b></p></div></div>`:''}
  <table><tr><th style="width:36px">Got</th><th style="width:28px">#</th><th>Item name</th><th class="r" style="width:76px">Ordered</th><th style="width:72px">Received</th><th style="width:140px">Remarks</th></tr>${part.map(it=>it.h?`<tr class="g"><td colspan="6">${esc(it.h)}</td></tr>`:(()=>{const r=it.r,c=ck(r.key),st=ckStatus(r);return `<tr><td class="bx"><span class="sq">${ckDone(r)?'✓':''}</span></td><td>${it.n}</td><td><b>${esc(r.name)}</b>${r.brand?`<span class="s">${esc(r.brand)}</span>`:''}</td><td class="r">${esc(r.qty)} ${esc(r.unit)}</td><td>${esc(c.recv??'')}</td><td>${esc([c.note,st].filter(Boolean).join(' · '))}</td></tr>`})()).join('')}</table>
  ${pi===pages.length-1?`<div class="sig"><div><i></i>Received at site</div><div><i></i>Checked by · ${esc(CO.name)}</div></div>`:''}
  <div class="ft"><span><b>${esc(CO.name)}</b> · Delivery checklist${M.site.client?' · '+esc(M.site.client):''}</span><span>${pi+1}/${pages.length}</span></div></div>`).join('');
}
function checkPages(){   // renders into #clPrint, shrinking rows per page until nothing overlaps the footer
  const host=$('#clPrint');host.style.cssText='display:block;position:fixed;left:-10000px;top:0;width:794px;visibility:hidden';

}

$('#clPrintBtn').onclick=()=>{const pages=checkPages();if(!pages.length)return toast('Nothing to print');
  if(sandboxed())return makePdf(pages,ckName(),true);
  document.body.classList.add('print-cl');window.print();setTimeout(()=>document.body.classList.remove('print-cl'),1500)};
$('#bPrint').onclick=doPrint;
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();$('#bSave').click()}if(e.key==='Escape'){if($('#mk').classList.contains('on'))closeModal();else $('#cl').classList.remove('on')}});

applyTheme();renderEd();renderPages();$('#docName').textContent=(M.site.client||'Untitled site')+' · '+M.inp.kw+' kW';
